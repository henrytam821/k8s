apiVersion: v1
kind: Namespace
metadata:
  name: nodejs-demo

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodejs-demo-app
  namespace: nodejs-demo
  labels:
    app: nodejs-demo
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nodejs-demo
  template:
    metadata:
      labels:
        app: nodejs-demo
     # annotations:
     #   prometheus.io/scrape: "true"
     #   prometheus.io/port: "3000"
    spec:
      containers:
      - name: nodejs-app
        image: node:20-alpine
        command: ["/bin/sh"]
        args:
          - -c
          - |
            cat > /app/index.js << 'EOF'
            const http = require('http');
            const hostname = '0.0.0.0';
            const port = 3000;
            
            const server = http.createServer((req, res) => {
              res.statusCode = 200;
              res.setHeader('Content-Type', 'text/html; charset=utf-8');
              res.end(`
                <!DOCTYPE html>
                <html>
                <head>
                  <title>Node.js Demo App</title>
                  <style>
                    body {
                      font-family: Arial, sans-serif;
                      display: flex;
                      justify-content: center;
                      align-items: center;
                      height: 100vh;
                      margin: 0;
                      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                    }
                    .container {
                      text-align: center;
                      background: white;
                      padding: 40px;
                      border-radius: 10px;
                      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
                    }
                    h1 { color: #333; margin: 0; }
                    p { color: #666; margin: 10px 0; }
                    .info { background: #f0f0f0; padding: 10px; border-radius: 5px; margin: 10px 0; }
                  </style>
                </head>
                <body>
                  <div class="container">
                    <h1>🚀 Node.js Demo App</h1>
                    <p>Running on Kubernetes</p>
                    <div class="info">
                      <p>Hostname: ${require('os').hostname()}</p>
                      <p>Node Version: ${process.version}</p>
                      <p>Uptime: ${Math.floor(process.uptime())}s</p>
                    </div>
                  </div>
                </body>
                </html>
              `);
            });
            
            server.listen(port, hostname, () => {
              console.log('Server running at http://' + hostname + ':' + port + '/');
            });
            EOF
            node /app/index.js
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
              - ALL

---
apiVersion: v1
kind: Service
metadata:
  name: nodejs-demo-service
  namespace: nodejs-demo
  labels:
    app: nodejs-demo
spec:
  type: LoadBalancer
  selector:
    app: nodejs-demo
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nodejs-demo-hpa
  namespace: nodejs-demo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nodejs-demo-app
  minReplicas: 1
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
